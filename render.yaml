# نشر مجاني على Render — حاوية واحدة من نفس الـ Dockerfile برابط عام
# بدون DATABASE_URL → التطبيق يشتغل بتخزين مؤقت (in-memory) فيه 3 طلبات تجريبية
services:
  - type: web
    name: docker-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: cloud
      - key: DEMO_MODE
        value: "true"
