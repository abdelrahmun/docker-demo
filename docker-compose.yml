# ==================================================================
#  بيئة تشغيل كاملة بأمر واحد:  docker compose up -d
#  app (طلبات الدعم الفني) ← db (PostgreSQL ببيانات دائمة)
#
#  الإعدادات وكلمات المرور من ملف .env (انسخ .env.example)
#  لو مفيش .env بتشتغل بقيم افتراضية آمنة للعرض فقط
# ==================================================================
name: docker-demo

services:
  # التطبيق: يُبنى من الـ Dockerfile (القالب الموحّد)
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: demo-app:${APP_VERSION:-1.0.0} # الترقية والرجوع = تغيير رقم الإصدار فقط
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DEMO_MODE: "true" # يفعّل /crash لعرض التعافي الذاتي
      # كلمة المرور تُمرَّر وقت التشغيل — لا تدخل الصورة أبدًا
      DATABASE_URL: postgres://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk-demo-only}@db:5432/${POSTGRES_DB:-helpdesk}
    depends_on:
      db:
        condition: service_healthy # التطبيق يستنى لحد ما قاعدة البيانات تبقى جاهزة
    restart: unless-stopped # التعافي الذاتي: لو الحاوية وقعت ترجع تلقائيًا

  # قاعدة البيانات: صورة رسمية بإصدار مثبّت + Volume للبيانات
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk-demo-only}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  db-data: # البيانات تفضل موجودة حتى لو الحاويات اتمسحت أو اتحدّثت
