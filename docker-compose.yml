# ==================================================================
#  بيئة تشغيل كاملة بأمر واحد:  docker compose up -d
#  proxy (موزّع الأحمال) ← app (3 نسخ من التطبيق) ← cache (Redis)
# ==================================================================
name: docker-demo

services:
  # موزّع الأحمال: نقطة الدخول الوحيدة من الخارج على المنفذ 8080
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # التطبيق: يُبنى من الـ Dockerfile (القالب) ويعمل منه 3 نسخ
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: demo-app:${APP_VERSION:-1.0.0}
    environment:
      APP_ENV: ${APP_ENV:-demo}
      REDIS_HOST: cache
      DEMO_MODE: "true"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped # التعافي الذاتي: أي نسخة تتوقف تعود تلقائيًا
    depends_on:
      - cache

  # قاعدة بيانات بسيطة (عدّاد الزيارات) مع تخزين دائم
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache-data:/data
    restart: unless-stopped

volumes:
  cache-data: # البيانات تبقى حتى لو حُذفت الحاوية
